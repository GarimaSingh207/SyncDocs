# ==============================================================================
# Nginx Configuration File for SyncDocs Platform
# Location: /etc/nginx/sites-available/syncdocs.conf
# Enable:   sudo ln -s /etc/nginx/sites-available/syncdocs.conf /etc/nginx/sites-enabled/
# ==============================================================================

upstream syncdocs_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    
    # Replace with your actual domain or EC2 Public IP address
    server_name _;

    # Client body size limit
    client_max_body_size 10M;

    # Gzip Compression Setup
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/x-javascript
        text/css
        text/javascript
        text/plain
        text/xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # 1. Frontend Static File Serving (React Vite Build Output)
    # --------------------------------------------------------------------------
    root /var/www/syncdocs/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching strategy
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --------------------------------------------------------------------------
    # 2. REST API Endpoints Reverse Proxy
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://syncdocs_backend;
        
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for REST API
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 3. Socket.IO Real-Time WebSockets Proxy
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://syncdocs_backend;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical: Long timeouts to prevent WebSocket connection termination
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # Disable buffering for real-time WebSocket traffic
        proxy_buffering off;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
